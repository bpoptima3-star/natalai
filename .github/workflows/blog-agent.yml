name: Blog Agent

on:
  schedule:
    - cron: '0 6 * * *'      # once a day, 06:00 UTC (12h before Tumblr)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run blog agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/blog-agent.js

      - name: Commit & push
        run: |
          git config user.name "NatalAI Blog Agent"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Blog: new article $(date '+%F %H:%M')" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X ours origin/main && git push origin main && { echo "pushed"; exit 0; }
            git rebase --abort 2>/dev/null || true
            echo "retry $i..."; sleep 5
          done
          echo "push failed after retries"; exit 1
