name: Mark All Posted (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/mark-all-posted.js
      - run: |
          git config user.name "NatalAI Bot"
          git config user.email "actions@github.com"
          git add blog/articles.json
          git commit -m "Backfill: mark existing articles as posted" || { echo "nothing"; exit 0; }
          git pull --rebase origin main
          git push origin main
